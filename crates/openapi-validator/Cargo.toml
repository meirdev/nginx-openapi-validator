[package]
name = "openapi-validator"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonschema = { version = "0.58", default-features = false, features = ["idna"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"
matchit = "0.9"
mime = "0.3"
roxmltree = "0.20"
thiserror = "2"
log = "0.4"

[dev-dependencies]
pretty_assertions = "1"
