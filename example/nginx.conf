# Load the OpenAPI validator module
load_module modules/libngx_oav_module.so;

worker_processes 1;
error_log /dev/stdout warn;

events {
    worker_connections 64;
}

http {
    # Custom log format with OpenAPI validation variables:
    #   $oav_status       - "valid" or "invalid"
    #   $oav_error_count  - number of validation errors
    #   $oav_first_error  - first error message
    #   $oav_errors_json  - all errors as JSON array
    log_format oav '$remote_addr [$time_local] "$request" $status '
                   'oav_status=$oav_status oav_errors=$oav_error_count '
                   'oav_detail="$oav_first_error"';

    access_log /dev/stdout oav;

    server {
        listen 80;

        # Validated API location (block mode - rejects invalid requests).
        # Body validation buffers the whole request body before proxying,
        # so proxy_request_buffering off has no effect here.
        location /api/ {
            openapi_spec /etc/nginx/api-spec.json;
            openapi_validate on;
            openapi_validate_mode block;

            proxy_pass http://backend:5678/;
        }

        # Unvalidated location (for comparison)
        location / {
            proxy_pass http://backend:5678/;
        }
    }
}
